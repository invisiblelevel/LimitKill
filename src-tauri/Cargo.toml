[package]
name = "limitkill"
version = "1.0.0"
license = "MIT"
description = "Local-first AI coding workspace with Smart RAG, streamed responses and multi-account rotation"
authors = ["LimitKill Contributors"]
edition = "2021"

[lib]
name = "limitkill_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Используется production-сборкой Tauri: встраивает frontendDist в бинарник.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }
futures-util = "0.3"
ignore = "0.4"
regex = "1"
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
url = "2"
zip = { version = "2.6", default-features = false, features = ["deflate"] }
quick-xml = "0.42"
pdf-extract = "0.7"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
